# Tag-driven Android release pipeline.
#
# Required repository secrets:
#   EXPO_TOKEN  Personal access token from expo.dev (User Settings → Access
#               Tokens). Used by expo/expo-github-action to authenticate
#               `eas build` non-interactively.
# The default GITHUB_TOKEN (provided by Actions) is used by `gh release`
# to create the release and upload the APK.
#
# Optional repository variables / secrets:
#   ANDROID_SIGNING_FINGERPRINT  SHA-256 fingerprint of the production signing
#               key (retrieve with `eas credentials --platform android`).
#               If unset, a placeholder is written into the release notes and
#               the maintainer must edit the release before publishing.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK on EAS
        id: build
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --json \
            --wait > build.json
          BUILD_ID=$(jq -r '.[0].id' build.json)
          ARTIFACT_URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          echo "build-id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact-url=${ARTIFACT_URL}" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          curl -fL -o "dist/tocarta-${TAG}.apk" \
            "${{ steps.build.outputs.artifact-url }}"
          echo "APK_PATH=dist/tocarta-${TAG}.apk" >> "$GITHUB_ENV"

      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          FINGERPRINT="${{ secrets.ANDROID_SIGNING_FINGERPRINT }}"
          if [ -n "$FINGERPRINT" ]; then
            scripts/release-notes.sh "$TAG" "$APK_PATH" "$FINGERPRINT" > release-notes.md
          else
            scripts/release-notes.sh "$TAG" "$APK_PATH" > release-notes.md
          fi

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "Tocarta $TAG" \
            --notes-file release-notes.md \
            "$APK_PATH"
